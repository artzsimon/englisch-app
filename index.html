  <style>
:root {
  --ink: #1c1916;
  --muted: #5c564e;
  --paper: #f3efe6;
  --card: #fffdf8;
  --line: #e4ddd2;
  --accent: #0f5f56;
  --accent-soft: #e6f3f1;
  --good: #0f7a4a;
  --good-bg: #e7f6ee;
  --bad: #b42318;
  --bad-bg: #fdecea;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  min-height: 100%;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  padding: 12px 16px max(20px, env(safe-area-inset-bottom));
}
button, input {
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, p { margin: 0; }
.kicker {
  color: var(--accent);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.home-title {
  font-size: 28px;
  letter-spacing: -0.6px;
  line-height: 1.15;
  margin: 0 0 8px;
}
.lead { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 0 0 18px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 1px 0 rgba(28,25,22,0.04);
}
.card-btn {
  display: block;
  width: 100%;
  text-align: left;
  margin-bottom: 8px;
  cursor: pointer;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 1px 0 rgba(28,25,22,0.04);
}
.card-title { font-weight: 800; font-size: 20px; }
.card-title.sm { font-size: 17px; }
.teaser { color: var(--muted); font-size: 15px; margin-top: 4px; line-height: 1.4; }
.meta { margin-top: 10px; color: var(--accent); font-weight: 700; font-size: 14px; }
.banner {
  background: var(--accent-soft);
  border: none;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}
.back {
  display: inline-block;
  min-height: 40px;
  padding: 8px 12px 8px 0;
  background: transparent;
  color: var(--accent);
  font-size: 16px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-align: left;
}
h1.page { font-size: 26px; margin: 4px 0 6px; letter-spacing: -0.4px; }
h1.quiz { font-size: 22px; margin: 4px 0; letter-spacing: -0.3px; }
h2.sec { font-size: 18px; margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 16px; }
.lesson { margin-bottom: 10px; }
.lesson-h { font-weight: 800; margin-bottom: 6px; }
.lesson-b { font-size: 15px; line-height: 1.5; }
.example {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--paper);
  border-radius: 10px;
  font-size: 14px;
  font-style: italic;
}
.vocab { padding: 0; overflow: hidden; margin-bottom: 12px; }
.vocab-row {
  display: grid;
  grid-template-columns: 1fr 1fr 0.9fr;
  gap: 0;
  font-size: 13px;
  padding: 10px 12px;
  line-height: 1.35;
  border-top: 1px solid var(--line);
}
.vocab-head {
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
  border-top: none;
}
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.q { margin: 0 0 8px; font-size: 18px; line-height: 1.45; font-weight: 700; }
.hint { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.opt {
  display: block;
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 17px;
  font-weight: 600;
  text-align: left;
  padding: 12px 14px;
  margin-bottom: 8px;
  cursor: pointer;
}
.opt.chosen { background: var(--accent-soft); border-color: var(--accent); }
.opt.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { margin-top: 8px; border-radius: 12px; padding: 12px; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.no { background: var(--bad-bg); color: var(--bad); }
.fb-title { font-weight: 800; }
.primary, .ghost, .submit, .linkish {
  display: block;
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  border: none;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}
.primary, .submit { background: var(--accent); color: #fff; margin-top: 14px; }
.ghost { background: var(--accent-soft); color: var(--accent); margin-top: 10px; }
.linkish {
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
  margin-top: 8px;
  margin-bottom: 12px;
}
.passage {
  margin: 0 0 14px;
  line-height: 1.65;
  font-size: 16px;
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 12px;
}
.gap {
  display: inline-block;
  min-width: 52px;
  margin: 0 3px;
  padding: 0 6px;
  border-bottom: 2px solid var(--muted);
  color: var(--muted);
  font-weight: 700;
  border-radius: 4px;
}
.gap.on {
  border-bottom-color: var(--accent);
  color: var(--accent);
  background: #fff;
}
.result { text-align: center; padding: 24px 16px; }
.score { font-size: 42px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
.pct { font-size: 16px; font-weight: 700; margin: 4px 0 8px; }
.mistake { border-top: 1px solid var(--line); padding: 10px 0; }
.mistake:first-of-type { border-top: none; }
.m-q { font-weight: 700; margin-bottom: 4px; }
.m-bad { font-size: 14px; color: var(--bad); }
.m-good { font-size: 14px; color: var(--good); }
.m-ex { font-size: 14px; color: var(--ink); margin-top: 4px; line-height: 1.4; }
.foot { margin-top: 22px; color: var(--muted); font-size: 14px; line-height: 1.45; }
.tests { margin: 18px 0 8px; }
input[type="text"], input[type="password"] {
  width: 100%;
  min-height: 52px;
  font-size: 16px;
  border-radius: 14px;
  border: 2px solid var(--line);
  padding: 12px 14px;
  margin-bottom: 10px;
  background: #fff;
}
label.pw {
  display: block;
  font-weight: 700;
  margin: 0 0 8px;
  font-size: 15px;
}
.err {
  background: var(--bad-bg);
  color: var(--bad);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  font-weight: 700;
}
.wait { color: var(--muted); font-size: 15px; margin-top: 8px; }
.sol-item { border-top: 1px solid var(--line); padding: 12px 0; }
.sol-item:first-of-type { border-top: none; }
.sol-a { font-weight: 700; color: var(--good); margin: 6px 0; }
.quiz-block { margin-bottom: 16px; }

  </style>
</head>

  <script>
  const DATA = {"topics":[{"id":"gerund","title":"Gerund","teaser":"-ing als Nomen: Subjekt, nach Verben und nach Präpositionen","lessonTitle":"Die 4 Regeln","lesson":[{"heading":"Was ist ein Gerund?","body":"Ein Gerund ist ein Verb mit -ing, das wie ein Nomen benutzt wird. Im Deutschen übersetzt man es oft mit „zu“ + Infinitiv: Living here is nice = Hier zu leben ist schön."},{"heading":"1. Als Subjekt (am Satzanfang)","body":"Steht die -ing-Form ganz vorne und ist das Subjekt des Satzes, brauchst du das Gerund.","examples":["Living in America is cool.","Meeting up isn't easy."]},{"heading":"2. Nach bestimmten Verben","body":"Nach Verben wie enjoy, miss, keep, stop, finish, imagine und don't mind folgt das Gerund — nicht to + Infinitiv.","examples":["I miss seeing my old friends.","Matt enjoys being in Pittsburgh."]},{"heading":"3. Nach Präpositionen","body":"Nach at, of, about, for, in, on, with, without und auch nach to in look forward to steht immer das Gerund. Hier ist to eine Präposition, kein Teil des Infinitivs.","examples":["Lena is afraid of changing too much.","I'm looking forward to seeing Matt."]},{"heading":"4. Nach Adjektiv + Präposition","body":"Wendungen wie good at, afraid of, interested in, tired of und worried about verlangen ebenfalls das Gerund.","examples":["I'm good at playing football.","Matt isn't worried about being bored."]},{"heading":"Rechtschreibung","body":"Wie beim Present Progressive: ein stummes -e am Ende fällt weg (live → living). Nach kurzem Vokal wird der Konsonant verdoppelt (get → getting)."},{"heading":"Tipp für Lückentexte","body":"Frage in dieser Reihenfolge: Steht das Verb am Satzanfang? Steht davor enjoy, miss, stop, finish oder don't mind? Steht davor eine Präposition? Steht davor Adjektiv + Präposition? Wenn ja: Gerund. Wenn nein, oft to + Infinitiv (want, decide, hope, promise, would like)."}],"quizzes":[{"id":"gerund-subject","title":"Subjekt und nach Verben","blurb":"8 Aufgaben · richtige -ing-Form wählen","questions":[{"prompt":"_____ (swim) in the sea is refreshing.","options":["Swimming","To swim","Swim","Swiming"]},{"prompt":"Tom doesn't mind _____ (get) up early.","options":["getting","to get","get","geting"]},{"prompt":"_____ (learn) the guitar takes time.","options":["Learning","To learn","Learn","Learns"]},{"prompt":"Emma enjoys _____ (dance) at parties.","options":["dancing","to dance","dance","danceing"]},{"prompt":"I miss _____ (live) next to the park.","options":["living","to live","live","liveing"]},{"prompt":"They keep _____ (make) the same mistake.","options":["making","to make","make","makeing"]},{"prompt":"_____ (eat) too much chocolate isn't healthy.","options":["Eating","To eat","Eat","Eats"]},{"prompt":"She finished _____ (do) her homework.","options":["doing","to do","do","done"]}]},{"id":"gerund-prep","title":"Nach Präpositionen","blurb":"8 Aufgaben · Gerund nach of, to, in, for …","questions":[{"prompt":"Paul is afraid of _____ (fail) the test.","options":["failing","to fail","fail","failling"]},{"prompt":"We are looking forward to _____ (spend) the weekend together.","options":["spending","to spend","spend","spent"]},{"prompt":"He is interested in _____ (join) the school club.","options":["joining","to join","join","joins"]},{"prompt":"Are you tired of _____ (sit) in this classroom?","options":["sitting","to sit","sit","siting"]},{"prompt":"She thinks about _____ (move) to Canada.","options":["moving","to move","move","moveing"]},{"prompt":"I'm good at _____ (draw) animals.","options":["drawing","to draw","draw","drawwing"]},{"prompt":"They left without _____ (say) goodbye.","options":["saying","to say","say","said"]},{"prompt":"Thank you for _____ (come) to my party.","options":["coming","to come","come","came"]}]},{"id":"gerund-or-inf","title":"Gerund oder to-Infinitiv","blurb":"10 Aufgaben · typische Klassenarbeitsfrage","questions":[{"prompt":"I want _____ (buy) a new phone.","options":["to buy","buying","buy","bought"]},{"prompt":"She enjoys _____ (bake) cakes.","options":["baking","to bake","bake","bakes"]},{"prompt":"We decided _____ (take) the train.","options":["to take","taking","take","took"]},{"prompt":"He finished _____ (pack) his bag.","options":["packing","to pack","pack","packed"]},{"prompt":"I'd like _____ (visit) my cousins.","options":["to visit","visiting","visit","visited"]},{"prompt":"Please stop _____ (shout).","options":["shouting","to shout","shout","shouted"]},{"prompt":"They hope _____ (arrive) on time.","options":["to arrive","arriving","arrive","arrived"]},{"prompt":"I don't mind _____ (walk) in the rain.","options":["walking","to walk","walk","walked"]},{"prompt":"She promised _____ (help) us tomorrow.","options":["to help","helping","help","helps"]},{"prompt":"Imagine _____ (win) the lottery.","options":["winning","to win","win","won"]}]},{"id":"gerund-transform","title":"Sätze umformen","blurb":"6 Aufgaben · Satz mit Gerund wählen","questions":[{"prompt":"Wähle die richtige Umformung: It is fun to ride a bike.","options":["Riding a bike is fun.","To riding a bike is fun.","Ride a bike is fun."]},{"prompt":"It is easy to forget names.","options":["Forgetting names is easy.","Forget names is easy.","To forgetting names is easy."]},{"prompt":"It is important to be on time.","options":["Being on time is important.","Be on time is important.","To being on time is important."]},{"prompt":"I look forward _____ my friends. (see)","options":["I look forward to seeing my friends.","I look forward to see my friends.","I look forward seeing my friends."]},{"prompt":"She is afraid of _____ her keys. (lose)","options":["She is afraid of losing her keys.","She is afraid of to lose her keys.","She is afraid of lose her keys."]},{"prompt":"He is good at _____ bikes. (fix)","options":["He is good at fixing bikes.","He is good at to fix bikes.","He is good at fix bikes."]}]}]},{"id":"be-ae","title":"British & American English","teaser":"Wortschatz und typische Rechtschreibunterschiede","lessonTitle":"BE oder AE?","lesson":[{"heading":"Wortschatz","body":"In Klassenarbeiten musst du oft das britische oder amerikanische Pendant einsetzen. Lerne die Paare zusammen, nicht einzeln."},{"heading":"Rechtschreibung","body":"Häufig abgefragt: BE -our/-re/-ise (colour, centre, organise, neighbourhood) gegen AE -or/-er/-ize (color, center, organize, neighborhood). Dieselbe Regel gilt auch für favourite/favorite."}],"quizzes":[{"id":"beae-words","title":"Wortschatz BE ↔ AE","blurb":"10 Aufgaben · das passende Wort wählen","questions":[{"prompt":"British English: flat → American English?","options":["apartment","lift","store","vacation"]},{"prompt":"American English: store → British English?","options":["shop","flat","cinema","pavement"]},{"prompt":"Was ist das amerikanische Wort für football?","options":["soccer","football","pavement","elevator"]},{"prompt":"Was ist das britische Wort für elevator?","options":["lift","flat","torch","rubbish"]},{"prompt":"British English: holiday → American English?","options":["vacation","cinema","sidewalk","garbage"]},{"prompt":"American English: movie theater → British English?","options":["cinema","shop","mall","torch"]},{"prompt":"Welches amerikanische Wort passt zu rubbish?","options":["garbage","pavement","lift","shop"]},{"prompt":"American English: sidewalk → British English?","options":["pavement","torch","flat","holiday"]},{"prompt":"Was ist das amerikanische Wort für torch?","options":["flashlight","elevator","soccer","apartment"]},{"prompt":"British English: shopping centre → American English?","options":["shopping mall","cinema","pavement","storey"]}]},{"id":"beae-spelling","title":"Rechtschreibung BE / AE","blurb":"8 Aufgaben · -our/-or, -re/-er, -ise/-ize","questions":[{"prompt":"Wie schreibt man colour auf American English?","options":["color","colour","coler","collor"]},{"prompt":"Wie schreibt man center auf British English?","options":["centre","center","centere","centré"]},{"prompt":"Welche Schreibweise von organise ist amerikanisch?","options":["organize","organise","organice","organeese"]},{"prompt":"Wie schreibt man neighbourhood auf American English?","options":["neighborhood","neighbourhood","nieghborhood","neighborhoud"]},{"prompt":"Wie schreibt man favourite auf American English?","options":["favorite","favourite","favorit","favourit"]},{"prompt":"Welche Schreibweise ist britisch?","options":["neighbourhood","neighborhood","neighborhod","neighbourhod"]},{"prompt":"In American English schreibt man:","options":["center","centre","centrum","centar"]},{"prompt":"Welche Schreibweise ist britisch?","options":["organise","organize","organiz","organisze"]}]}]},{"id":"tenses","title":"Simple Present & Progressive","teaser":"Gewohnheit oder genau jetzt? Signalwörter und Zustandsverben","lessonTitle":"Welche Zeitform?","lesson":[{"heading":"Simple Present","body":"Für Dinge, die immer, regelmäßig oder oft passieren: Hobbys, Routinen, Fakten. Signalwörter: always, usually, often, sometimes, never, every day. Form: Grundform, bei he/she/it kommt -s dazu.","examples":["Matt usually lives in Pittsburgh."]},{"heading":"Present Progressive","body":"Für Handlungen, die genau jetzt oder nur vorübergehend passieren. Signalwörter: now, at the moment, look!, listen!. Form: am/is/are + Verb-ing.","examples":["Right now, I am reading a grammar book."]},{"heading":"Zustandsverben","body":"Verben wie like, love, hate, want, know und understand stehen fast nie im Progressive, sondern im Simple Present. Richtig: I like pizza. Falsch: I am liking pizza."}],"quizzes":[{"id":"tense-form","title":"Die richtige Zeitform","blurb":"8 Aufgaben · Simple Present oder Progressive","questions":[{"prompt":"Look! The dog _____ (chase) the cat.","options":["is chasing","chases","chase","chasing"]},{"prompt":"My mum usually _____ (drink) tea in the morning.","options":["drinks","is drinking","drink","drinking"]},{"prompt":"Quiet! The students _____ (take) a test at the moment.","options":["are taking","take","takes","taking"]},{"prompt":"We sometimes _____ (go) to the swimming pool on Fridays.","options":["go","are going","goes","going"]},{"prompt":"Right now, Ben _____ (make) a sandwich.","options":["is making","makes","make","is makeing"]},{"prompt":"She _____ (know) a lot about dinosaurs.","options":["knows","is knowing","know","knowing"]},{"prompt":"Listen! Someone _____ (knock) at the door.","options":["is knocking","knocks","knock","knocking"]},{"prompt":"I _____ (want) a glass of water.","options":["want","am wanting","wants","wanting"]}]},{"id":"tense-neg-q","title":"Verneinungen und Fragen","blurb":"8 Aufgaben · don't/doesn't, am/is/are not, Do/Does/Is","questions":[{"prompt":"Bilde die Verneinung: She plays tennis every Monday.","options":["She doesn't play tennis every Monday.","She doesn't plays tennis every Monday.","She isn't play tennis every Monday."]},{"prompt":"Bilde die Frage: They are watching the match.","options":["Are they watching the match?","Do they watching the match?","Are they watch the match?"]},{"prompt":"Bilde die Verneinung: He is wearing a blue jacket.","options":["He isn't wearing a blue jacket.","He doesn't wearing a blue jacket.","He isn't wear a blue jacket."]},{"prompt":"Bilde die Frage: You go to school by bike.","options":["Do you go to school by bike?","Are you go to school by bike?","Does you go to school by bike?"]},{"prompt":"Bilde die Verneinung: We always have breakfast at 7.","options":["We don't always have breakfast at 7.","We aren't always have breakfast at 7.","We don't always has breakfast at 7."]},{"prompt":"Bilde die Frage: Lisa is talking to her teacher.","options":["Is Lisa talking to her teacher?","Does Lisa talking to her teacher?","Is Lisa talk to her teacher?"]},{"prompt":"Bilde die Frage: He gets up at 6 every day.","options":["Does he get up at 6 every day?","Does he gets up at 6 every day?","Is he get up at 6 every day?"]},{"prompt":"Bilde die Verneinung: The children are running in the hall.","options":["The children     try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") return parsed;
    } catch (e) {}
    return {};
  }
  function saveProgress(next) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
  }
  function normalize(value) {
    return String(value).trim().toLowerCase().replace(/\s+/g, " ");
  }
  function b64dec(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64enc(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  async function hashAnswer(value) {
    const enc = new TextEncoder();
    const norm = enc.encode(normalize(value));
    const salt = b64dec(hashSalt);
    const msg = new Uint8Array(salt.length + norm.length);
    msg.set(salt, 0);
    msg.set(norm, salt.length);
    return b64enc(await crypto.subtle.digest("SHA-256", msg));
  }
  async function isRight(topicId, quizId, index, given) {
    const key = quizKey(topicId, quizId);
    const hashes = (answerHashes[key] && answerHashes[key][index]) || [];
    const h = await hashAnswer(given);
    return hashes.indexOf(h) !== -1;
  }
  async function deriveKey(password, saltB64) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64dec(saltB64), iterations: ITERATIONS, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }
  async function unlockWithPassword(password) {
    const key = await deriveKey(password, vault.salt);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64dec(vault.iv) },
      key,
      b64dec(vault.ciphertext)
    );
    solutions = JSON.parse(new TextDecoder().decode(plain));
    unlocked = true;
    pwError = "";
  }
  function findTopic(id) {
    for (let i = 0; i < topics.length; i++) if (topics[i].id === id) return topics[i];
    return null;
  }
  function findQuiz(topicId, quizId) {
    const topic = findTopic(topicId);
    if (!topic) return null;
    for (let i = 0; i < topic.quizzes.length; i++) if (topic.quizzes[i].id === quizId) return topic.quizzes[i];
    return null;
  }
  function quizKey(topicId, quizId) { return topicId + ":" + quizId; }
  function esc(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function arg(value) { return encodeURIComponent(value == null ? "" : String(value)); }
  function recordScore(topicId, quizId, score, total) {
    const key = quizKey(topicId, quizId);
    const old = progress[key];
    progress = Object.assign({}, progress);
    progress[key] = {
      best: Math.max(old && old.best ? old.best : 0, score),
      last: score,
      total: total
    };
    saveProgress(progress);
  }
  function startQuiz(topicId, quizId) {
    quizState = { index: 0, typed: "", chosen: null, checked: false, ok: false, score: 0, mistakes: [] };
    screen = { name: "quiz", topicId: topicId, quizId: quizId };
    pwError = "";
    render();
  }
  function passageHtml(text, current) {
    const parts = text.split("___");
    let html = '<p class="passage">';
    for (let i = 0; i < parts.length; i++) {
      html += esc(parts[i]);
      if (i < parts.length - 1) {
        html += '<span class="gap' + (i === current ? " on" : "") + '">' + (i + 1) + "</span>";
      }
    }
    return html + "</p>";
  }
  function passwordForm(act) {
    let html = '<form class="card" data-act="password-form" data-next="' + esc(act) + '" style="margin-top:14px">';
    html += '<label class="pw" for="pw-input">Passwort für die Lösungen</label>';
    if (pwError) html += '<div class="err">' + esc(pwError) + "</div>";
    html += '<input type="password" id="pw-input" name="password" autocomplete="off" inputmode="numeric" placeholder="Passwort">';
    html += '<button type="submit" class="submit"' + (pwBusy ? " disabled" : "") + ">" + (pwBusy ? "Prüfe …" : "Lösungen entsperren") + "</button>";
    if (pwBusy) html += '<p class="wait">Einen Moment, das dauert kurz.</p>';
    html += "</form>";
    return html;
  }
  function solutionList(topicId, quizId) {
    const quiz = findQuiz(topicId, quizId);
    const items = solutions[quizKey(topicId, quizId)] || [];
    let html = '<div class="card" style="margin-top:14px"><h2 class="sec">Lösungen</h2>';
    quiz.questions.forEach(function (question, i) {
      const sol = items[i] || { accepted: [], explanation: "" };
      html += '<div class="sol-item"><div class="m-q">' + (i + 1) + ". " + esc(question.prompt) + "</div>";
      html += '<div class="sol-a">Antwort: ' + esc((sol.accepted || []).join(" / ")) + "</div>";
      if (sol.explanation) html += '<div class="m-ex">' + esc(sol.explanation) + "</div>";
      html += "</div>";
    });
    html += "</div>";
    return html;
  }

  function homeView() {
    const done = Object.keys(progress).length;
    let html = '<div class="kicker">KLASSE 8 · GYMNASIUM NRW</div>';
    html += '<h1 class="home-title">Englisch lernen</h1>';
    html += '<p class="lead">Kurze Erklärungen und Tests zu Gerund, British und American English sowie Simple Present und Present Progressive. Tippe eine Antwort an und bekommst sofort Bescheid, ob sie stimmt.</p>';
    if (done > 0) {
      html += '<div class="banner">Schon ' + done + " " + (done === 1 ? "Test" : "Tests") + " gemacht. Deine besten Punkte bleiben auf diesem Gerät gespeichert.</div>";
    }
    topics.forEach(function (topic) {
      const finished = topic.quizzes.filter(function (quiz) { return progress[quizKey(topic.id, quiz.id)]; }).length;
      html += '<button type="button" class="card-btn" data-act="open-topic" data-arg="' + arg(topic.id) + '">';
      html += '<div class="card-title">' + esc(topic.title) + "</div>";
      html += '<div class="teaser">' + esc(topic.teaser) + "</div>";
      html += '<div class="meta">' + topic.quizzes.length + " Tests" + (finished ? " · " + finished + " gemacht" : "") + "</div>";
      html += "</button>";
    });
    html += '<p class="foot">Tipp fürs iPhone: In Safari auf <b>Teilen</b> tippen und <b>Zum Home-Bildschirm</b> wählen. Dann öffnet sich die Übung wie eine eigene App, ganz ohne die Grok-Bot-App.</p>';
    return html;
  }

  function topicView(topic) {
    let html = '<button type="button" class="back" data-act="home">‹ Übersicht</button>';
    html += '<h1 class="page">' + esc(topic.title) + "</h1>";
    html += '<p class="lead">' + esc(topic.teaser) + "</p>";
    html += '<h2 class="sec">' + esc(topic.lessonTitle) + "</h2>";
    if (topic.id === "be-ae") {
      html += '<div class="card vocab"><div class="vocab-row vocab-head"><span>British</span><span>American</span><span>Deutsch</span></div>';
      vocabRows.forEach(function (row) {
        html += '<div class="vocab-row"><span>' + esc(row[0]) + "</span><span>" + esc(row[1]) + '</span><span class="muted">' + esc(row[2]) + "</span></div>";
      });
      html += "</div>";
    }
    topic.lesson.forEach(function (block) {
      html += '<div class="card lesson"><div class="lesson-h">' + esc(block.heading) + "</div>";
      html += '<div class="lesson-b">' + esc(block.body) + "</div>";
      (block.examples || []).forEach(function (example) {
        html += '<div class="example">' + esc(example) + "</div>";
      });
      html += "</div>";
    });
    html += '<h2 class="sec tests">Tests</h2>';
    topic.quizzes.forEach(function (quiz) {
      const saved = progress[quizKey(topic.id, quiz.id)];
      html += '<div class="quiz-block">';
      html += '<button type="button" class="card-btn" data-act="start-quiz" data-topic="' + arg(topic.id) + '" data-arg="' + arg(quiz.id) + '">';
      html += '<div class="card-title sm">' + esc(quiz.title) + "</div>";
      html += '<div class="teaser">' + esc(quiz.blurb) + "</div>";
      if (saved) html += '<div class="meta">Beste Punktzahl: ' + saved.best + "/" + saved.total + "</div>";
      html += "</button>";
      html += '<button type="button" class="linkish" data-act="open-solutions" data-topic="' + arg(topic.id) + '" data-arg="' + arg(quiz.id) + '">Lösungen anzeigen</button>';
      html += "</div>";
    });
    return html;
  }

  function quizView(quiz) {
    const st = quizState;
    const question = quiz.questions[st.index];
    if (!question) return "";
    const total = quiz.questions.length;
    const options = question.options;
    const pct = Math.round(((st.index + (st.checked ? 1 : 0)) / total) * 100);
    let html = '<button type="button" class="back" data-act="back-topic">‹ Zurück</button>';
    html += '<h1 class="quiz">' + esc(quiz.title) + "</h1>";
    html += '<div class="hint">Frage ' + (st.index + 1) + " von " + total + "</div>";
    html += '<div class="bar"><span style="width:' + pct + '%"></span></div>';
    html += '<div class="card" style="margin-top:16px">';
    if (question.passage) html += passageHtml(question.passage, st.index);
    html += '<p class="q">' + esc(question.prompt) + "</p>";
    html += question.hint ? '<p class="hint">' + esc(question.hint) + "</p>" : '<div style="height:8px"></div>';
    if (options) {
      options.forEach(function (option) {
        let cls = "opt";
        if (st.checked && st.chosen === option && st.ok) cls += " good";
        else if (st.checked && st.chosen === option && !st.ok) cls += " bad";
        else if (st.chosen === option) cls += " chosen";
        html += '<button type="button" class="' + cls + '" ' + (st.checked ? "disabled " : "") + 'data-act="pick" data-arg="' + arg(option) + '">' + esc(option) + "</button>";
      });
    } else {
      const bg = st.checked ? (st.ok ? "var(--good-bg)" : "var(--bad-bg)") : "#fff";
      html += '<form data-act="check-form">';
      html += '<input type="text" id="gap-input" value="' + esc(st.typed) + '" ' + (st.checked ? "disabled " : "") + 'autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort tippen" style="background:' + bg + '">';
      if (!st.checked) html += '<button type="submit" class="submit">Prüfen</button>';
      html += "</form>";
    }
    if (st.checked) {
      html += '<div class="fb ' + (st.ok ? "ok" : "no") + '"><div class="fb-title">' + (st.ok ? "Richtig" : "Leider falsch") + "</div></div>";
    }
    html += "</div>";
    if (st.checked) {
      const last = st.index + 1 >= total;
      html += '<button type="button" class="primary" data-act="' + (last ? "finish" : "next") + '">' + (last ? "Ergebnis anzeigen" : "Weiter") + "</button>";
    }
    return html;
  }

  function resultView(quiz, result) {
    const pct = result.total === 0 ? 0 : Math.round((result.score / result.total) * 100);
    const message = pct === 100
      ? "Perfekt, alles richtig!"
      : pct >= 80
        ? "Sehr gut, das sitzt schon."
        : pct >= 50
          ? "Guter Anfang — schau dir die Fehler noch einmal an."
          : "Kein Problem, versuch es noch einmal.";
    let html = '<button type="button" class="back" data-act="back-topic">‹ Zu den Tests</button>';
    html += '<div class="card result"><div class="hint">' + esc(quiz.title) + "</div>";
    html += '<div class="score">' + result.score + "/" + result.total + "</div>";
    html += '<div class="pct">' + pct + " %</div>";
    html += '<p class="muted">' + esc(message) + "</p></div>";
    if (result.mistakes.length) {
      html += '<div class="card" style="margin-top:14px"><h2 class="sec">Deine Fehler</h2>';
      result.mistakes.forEach(function (item, i) {
        html += '<div class="mistake"><div class="m-q">' + esc(item.prompt) + "</div>";
        html += '<div class="m-bad">Deine Antwort: ' + esc(item.given) + "</div>";
        if (unlocked && solutions) {
          const sol = (solutions[quizKey(result.topicId, result.quizId)] || [])[item.index] || {};
          if (sol.accepted) html += '<div class="m-good">Richtig: ' + esc(sol.accepted.join(" / ")) + "</div>";
          if (sol.explanation) html += '<div class="m-ex">' + esc(sol.explanation) + "</div>";
        }
        html += "</div>";
      });
      html += "</div>";
    }
    if (unlocked) html += solutionList(result.topicId, result.quizId);
    else {
      html += '<button type="button" class="linkish" data-act="ask-password" data-next="result">Lösungen anzeigen</button>';
      if (screen.showPw) html += passwordForm("result");
    }
    html += '<button type="button" class="primary" data-act="retry">Test wiederholen</button>';
    html += '<button type="button" class="ghost" data-act="back-topic">Zurück zu den Tests</button>';
    return html;
  }

  function solutionsView(topicId, quizId) {
    const quiz = findQuiz(topicId, quizId);
    let html = '<button type="button" class="back" data-act="back-topic">‹ Zu den Tests</button>';
    html += '<h1 class="quiz">' + esc(quiz.title) + "</h1>";
    html += '<p class="lead">Lösungen und kurze Erklärungen zu diesem Test.</p>';
    if (unlocked) html += solutionList(topicId, quizId);
    else html += passwordForm("solutions");
    return html;
  }

  function view() {
    if (screen.name === "topic") {
      const topic = findTopic(screen.topicId);
      return topic ? topicView(topic) : homeView();
    }
    if (screen.name === "quiz") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? quizView(quiz) : homeView();
    }
    if (screen.name === "result") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? resultView(quiz, screen) : homeView();
    }
    if (screen.name === "solutions") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? solutionsView(screen.topicId, screen.quizId) : homeView();
    }
    return homeView();
  }

  function render() {
    document.getElementById("app").innerHTML = view();
    const input = document.getElementById("gap-input");
    if (input && quizState && !quizState.checked) {
      input.addEventListener("input", function () { quizState.typed = input.value; });
    }
    const pw = document.getElementById("pw-input");
    if (pw && !pwBusy) pw.focus();
  }

  async function checkAnswer(value) {
    if (!quizState || quizState.checked || !String(value).trim()) return;
    const quiz = findQuiz(screen.topicId, screen.quizId);
    const question = quiz.questions[quizState.index];
    const right = await isRight(screen.topicId, screen.quizId, quizState.index, value);
    quizState.chosen = value;
    quizState.checked = true;
    quizState.ok = right;
    if (right) quizState.score += 1;
    else quizState.mistakes.push({ prompt: question.prompt, given: value, index: quizState.index });
    render();
  }

  async function submitPassword(password, next) {
    if (pwBusy) return;
    pwBusy = true;
    pwError = "";
    render();
    try {
      await unlockWithPassword(password);
      screen.showPw = false;
      if (next === "solutions" || screen.name === "solutions") {
        screen = { name: "solutions", topicId: screen.topicId, quizId: screen.quizId };
      }
    } catch (e) {
      pwError = "Das Passwort ist falsch.";
      unlocked = false;
      solutions = null;
    }
    pwBusy = false;
    render();
  }

  function onClick(event) {
    const el = event.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "password-form" || act === "check-form") return;
    const a = decodeURIComponent(el.getAttribute("data-arg") || "");
    if (act === "open-topic") {
      screen = { name: "topic", topicId: a };
      render();
    } else if (act === "home") {
      screen = { name: "home" };
      render();
    } else if (act === "start-quiz") {
      startQuiz(decodeURIComponent(el.getAttribute("data-topic") || ""), a);
    } else if (act === "back-topic") {
      screen = { name: "topic", topicId: screen.topicId };
      quizState = null;
      pwError = "";
      render();
    } else if (act === "pick") {
      checkAnswer(a);
    } else if (act === "next") {
      quizState.index += 1;
      quizState.typed = "";
      quizState.chosen = null;
      quizState.checked = false;
      quizState.ok = false;
      render();
    } else if (act === "finish") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      recordScore(screen.topicId, screen.quizId, quizState.score, quiz.questions.length);
      screen = {
        name: "result",
        topicId: screen.topicId,
        quizId: screen.quizId,
        score: quizState.score,
        total: quiz.questions.length,
        mistakes: quizState.mistakes,
        showPw: false
      };
      quizState = null;
      render();
    } else if (act === "retry") {
      startQuiz(screen.topicId, screen.quizId);
    } else if (act === "open-solutions") {
      const topicId = decodeURIComponent(el.getAttribute("data-topic") || screen.topicId);
      screen = { name: "solutions", topicId: topicId, quizId: a };
      pwError = "";
      render();
    } else if (act === "ask-password") {
      screen.showPw = true;
      pwError = "";
      render();
    }
  }

  function onSubmit(event) {
    const form = event.target.closest("form");
    if (!form) return;
    event.preventDefault();
    const act = form.getAttribute("data-act");
    if (act === "check-form") {
      const input = document.getElementById("gap-input");
      checkAnswer(input ? input.value : "");
    } else if (act === "password-form") {
      const input = document.getElementById("pw-input");
      submitPassword(input ? input.value : "", form.getAttribute("data-next") || "solutions");
    }
  }

  const app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("submit", onSubmit);
  render();
})();

  </script>
</body>
</html>
