<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Niklas Englisch">
  <meta name="application-name" content="Niklas’ Englisch-App">
  <meta name="theme-color" content="#0f5f56">
  <meta name="description" content="Lern-App für Niklas: Gerund, British und American English, Simple Present und Present Progressive, Modalersatzformen und Mix-Tests, mit Versuchsprotokoll für die Elternansicht.">
  <title>Niklas’ Englisch-App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">

  <link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
  <style>
:root {
  --ink: #1c1916;
  --muted: #5c564e;
  --paper: #f3efe6;
  --card: #fffdf8;
  --line: #e4ddd2;
  --accent: #0f5f56;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, #fffdf8);
  --good: #0f7a4a;
  --good-bg: #e7f6ee;
  --bad: #b42318;
  --bad-bg: #fdecea;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  min-height: 100%;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  padding: 12px 16px max(20px, env(safe-area-inset-bottom));
}
button, input {
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, p { margin: 0; }
.kicker {
  color: var(--accent);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.home-title {
  font-size: 28px;
  letter-spacing: -0.6px;
  line-height: 1.15;
  margin: 0 0 8px;
}
.lead { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 0 0 18px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 1px 0 rgba(28,25,22,0.04);
}
.card-btn {
  display: block;
  width: 100%;
  text-align: left;
  margin-bottom: 8px;
  cursor: pointer;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 1px 0 rgba(28,25,22,0.04);
}
.card-title { font-weight: 800; font-size: 20px; }
.card-title.sm { font-size: 17px; }
.teaser { color: var(--muted); font-size: 15px; margin-top: 4px; line-height: 1.4; }
.meta { margin-top: 10px; color: var(--accent); font-weight: 700; font-size: 14px; }
.banner {
  background: var(--accent-soft);
  border: none;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}
.back {
  display: inline-block;
  min-height: 40px;
  padding: 8px 12px 8px 0;
  background: transparent;
  color: var(--accent);
  font-size: 16px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-align: left;
}
h1.page { font-size: 26px; margin: 4px 0 6px; letter-spacing: -0.4px; }
h1.quiz { font-size: 22px; margin: 4px 0; letter-spacing: -0.3px; }
h2.sec { font-size: 18px; margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 16px; }
.lesson { margin-bottom: 10px; }
.lesson-h { font-weight: 800; margin-bottom: 6px; }
.lesson-b { font-size: 15px; line-height: 1.5; }
.example {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--paper);
  border-radius: 10px;
  font-size: 14px;
  font-style: italic;
}
.vocab { padding: 0; overflow: hidden; margin-bottom: 12px; }
.vocab-row {
  display: grid;
  grid-template-columns: 1fr 1fr 0.9fr;
  gap: 0;
  font-size: 13px;
  padding: 10px 12px;
  line-height: 1.35;
  border-top: 1px solid var(--line);
}
.vocab-head {
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
  border-top: none;
}
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.q { margin: 0 0 8px; font-size: 18px; line-height: 1.45; font-weight: 700; }
.hint { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.opt {
  display: block;
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 17px;
  font-weight: 600;
  text-align: left;
  padding: 12px 14px;
  margin-bottom: 8px;
  cursor: pointer;
}
.opt.chosen { background: var(--accent-soft); border-color: var(--accent); }
.opt.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { margin-top: 8px; border-radius: 12px; padding: 12px; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.no { background: var(--bad-bg); color: var(--bad); }
.fb-title { font-weight: 800; }
.primary, .ghost, .submit, .linkish {
  display: block;
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  border: none;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}
.primary, .submit { background: var(--accent); color: #fff; margin-top: 14px; }
.ghost { background: var(--accent-soft); color: var(--accent); margin-top: 10px; }
.linkish {
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
  margin-top: 8px;
  margin-bottom: 12px;
}
.passage {
  margin: 0 0 14px;
  line-height: 1.65;
  font-size: 16px;
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 12px;
}
.gap {
  display: inline-block;
  min-width: 52px;
  margin: 0 3px;
  padding: 0 6px;
  border-bottom: 2px solid var(--muted);
  color: var(--muted);
  font-weight: 700;
  border-radius: 4px;
}
.gap.on {
  border-bottom-color: var(--accent);
  color: var(--accent);
  background: #fff;
}
.result { text-align: center; padding: 24px 16px; }
.score { font-size: 42px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
.pct { font-size: 16px; font-weight: 700; margin: 4px 0 8px; }
.mistake { border-top: 1px solid var(--line); padding: 10px 0; }
.mistake:first-of-type { border-top: none; }
.m-q { font-weight: 700; margin-bottom: 4px; }
.m-bad { font-size: 14px; color: var(--bad); }
.m-good { font-size: 14px; color: var(--good); }
.m-ex { font-size: 14px; color: var(--ink); margin-top: 4px; line-height: 1.4; }
.foot { margin-top: 22px; color: var(--muted); font-size: 14px; line-height: 1.45; }
.tests { margin: 18px 0 8px; }
input[type="text"], input[type="password"] {
  width: 100%;
  min-height: 52px;
  font-size: 16px;
  border-radius: 14px;
  border: 2px solid var(--line);
  padding: 12px 14px;
  margin-bottom: 10px;
  background: #fff;
}
label.pw {
  display: block;
  font-weight: 700;
  margin: 0 0 8px;
  font-size: 15px;
}
.err {
  background: var(--bad-bg);
  color: var(--bad);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  font-weight: 700;
}
.wait { color: var(--muted); font-size: 15px; margin-top: 8px; }
.sol-item { border-top: 1px solid var(--line); padding: 12px 0; }
.sol-item:first-of-type { border-top: none; }
.sol-a { font-weight: 700; color: var(--good); margin: 6px 0; }
.quiz-block { margin-bottom: 16px; }

.eltern-link {
  display: block;
  width: 100%;
  margin-top: 28px;
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  min-height: 36px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  border-radius: 99px;
  padding: 3px 8px;
  margin-left: 6px;
}
.badge.ok { background: var(--good-bg); color: var(--good); }
.badge.no { background: var(--bad-bg); color: var(--bad); }
.badge.mute { background: var(--paper); color: var(--muted); }
.task-log { border-top: 1px solid var(--line); padding: 10px 0; }
.task-log:first-of-type { border-top: none; }
.task-log .when { font-size: 13px; color: var(--muted); margin-top: 2px; }
.task-log .given { font-size: 14px; margin-top: 2px; }
.warn-list { margin: 8px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.45; }
.retry-note { font-size: 13px; color: var(--muted); margin-top: 6px; font-weight: 600; }

.warn-box {
  background: var(--bad-bg);
  color: var(--bad);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 0 0 12px;
  font-size: 15px;
  line-height: 1.45;
  font-weight: 650;
}
.warn-box.warn {
  background: #fff4e5;
  color: #8a4b08;
}
.warn-box.info {
  background: var(--paper);
  color: var(--muted);
  font-weight: 500;
}

.part-title {
  margin: 22px 0 10px;
  font-size: 15px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: 0.2px;
}
.part-title:first-of-type { margin-top: 8px; }

  </style>
</head>

  <script>
  const DATA = {"app":{"name":"Niklas’ Englisch-App","title":"Niklas’ Englisch-App","kicker":"KLASSE 8 · GYMNASIUM NRW","lead":"Zwei Teile in einer App: Teil 1 mit den Themen von Montag (Gerund, British und American English, Simple Present und Present Progressive) und Teil 2 mit den Aufgaben von den Arbeitsblättern (Zeiten, Modalersatzformen, Gerunds) plus Mix-Tests. Tippe eine Antwort an und bekommst sofort Bescheid, ob sie stimmt. Für die Wertung zählt nur der erste Versuch.","footer":"Tipp: Auf dem iPhone in Safari auf „Teilen“ und „Zum Home-Bildschirm“. Auf einem Android-Tablet in Chrome das Menü öffnen und „App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen. Ein Update erscheint beim nächsten Öffnen von selbst.","storageKey":"englisch-k8-progress-v1"},"topics":[{"id":"gerund","title":"Gerund","section":"Teil 1 · Von Montag","teaser":"-ing als Nomen: Subjekt, nach Verben und nach Präpositionen","lessonTitle":"Die 4 Regeln","tables":[],"lesson":[{"heading":"Was ist ein Gerund?","body":"Ein Gerund ist ein Verb mit -ing, das wie ein Nomen benutzt wird. Im Deutschen übersetzt man es oft mit „zu“ + Infinitiv: Living here is nice = Hier zu leben ist schön.","examples":[]},{"heading":"1. Als Subjekt (am Satzanfang)","body":"Steht die -ing-Form ganz vorne und ist das Subjekt des Satzes, brauchst du das Gerund.","examples":["Living in America is cool.","Meeting up isn't easy."]},{"heading":"2. Nach bestimmten Verben","body":"Nach Verben wie enjoy, miss, keep, stop, finish, imagine und don't mind folgt das Gerund — nicht to + Infinitiv.","examples":["I miss seeing my old friends.","Matt enjoys being in Pittsburgh."]},{"heading":"3. Nach Präpositionen","body":"Nach at, of, about, for, in, on, with, without und auch nach to in look forward to steht immer das Gerund. Hier ist to eine Präposition, kein Teil des Infinitivs.","examples":["Lena is afraid of changing too much.","I'm looking forward to seeing Matt."]},{"heading":"4. Nach Adjektiv + Präposition","body":"Wendungen wie good at, afraid of, interested in, tired of und worried about verlangen ebenfalls das Gerund.","examples":["I'm good at playing football.","Matt isn't worried about being bored."]},{"heading":"Rechtschreibung","body":"Wie beim Present Progressive: ein stummes -e am Ende fällt weg (live → living). Nach kurzem Vokal wird der Konsonant verdoppelt (get → getting).","examples":[]},{"heading":"Tipp für Lückentexte","body":"Frage in dieser Reihenfolge: Steht das Verb am Satzanfang? Steht davor enjoy, miss, stop, finish oder don't mind? Steht davor eine Präposition? Steht davor Adjektiv + Präposition? Wenn ja: Gerund. Wenn nein, oft to + Infinitiv (want, decide, hope, promise, would like).","examples":[]}],"quizzes":[{"id":"gerund-subject","title":"Subjekt und nach Verben","blurb":"8 Aufgaben · richtige -ing-Form wählen","questions":[{"prompt":"_____ (swim) in the sea is refreshing.","options":["Swimming","To swim","Swim","Swiming"]},{"prompt":"Tom doesn't mind _____ (get) up early.","options":["getting","to get","get","geting"]},{"prompt":"_____ (learn) the guitar takes time.","options":["Learning","To learn","Learn","Learns"]},{"prompt":"Emma enjoys _____ (dance) at parties.","options":["dancing","to dance","dance","danceing"]},{"prompt":"I miss _____ (live) next to the park.","options":["living","to live","live","liveing"]},{"prompt":"They keep _____ (make) the same mistake.","options":["making","to make","make","makeing"]},{"prompt":"_____ (eat) too much chocolate isn't healthy.","options":["Eating","To eat","Eat","Eats"]},{"prompt":"She finished _____ (do) her homework.","options":["doing","to do","do","done"]}]},{"id":"gerund-prep","title":"Nach Präpositionen","blurb":"8 Aufgaben · Gerund nach of, to, in, for …","questions":[{"prompt":"Paul is afraid of _____ (fail) the test.","options":["failing","to fail","fail","failling"]},{"prompt":"We are looking forward to _____ (spend) the weekend together.","options":["spending","to spend","spend","spent"]},{"prompt":"He is interested in _____ (join) the school club.","options":["joining","to join","join","joins"]},{"prompt":"Are you tired of _____ (sit) in this classroom?","options":["sitting","to sit","sit","siting"]},{"prompt":"She thinks about _____ (move) to Canada.","options":["moving","to move","move","moveing"]},{"prompt":"I'm good at _____ (draw) animals.","options":["drawing","to draw","draw","drawwing"]},{"prompt":"They left without _____ (say) goodbye.","options":["saying","to say","say","said"]},{"prompt":"Thank you for _____ (come) to my party.","options":["coming","to come","come","came"]}]},{"id":"gerund-or-inf","title":"Gerund oder to-Infinitiv","blurb":"10 Aufgaben · typische Klassenarbeitsfrage","questions":[{"prompt":"I want _____ (buy) a new phone.","options":["to buy","buying","buy","bought"]},{"prompt":"She enjoys _____ (bake) cakes.","options":["baking","to bake","bake","bakes"]},{"prompt":"We decided _____ (take) the train.","options":["to take","taking","take","took"]},{"prompt":"He finished _____ (pack) his bag.","options":["packing","to pack","pack","packed"]},{"prompt":"I'd like _____ (visit) my cousins.","options":["to visit","visiting","visit","visited"]},{"prompt":"Please stop _____ (shout).","options":["shouting","to shout","shout","shouted"]},{"prompt":"They hope _____ (arrive) on time.","options":["to arrive","arriving","arrive","arrived"]},{"prompt":"I don't mind _____ (walk) in the rain.","options":["walking","to walk","walk","walked"]},{"prompt":"She promised _____ (help) us tomorrow.","options":["to help","helping","help","helps"]},{"prompt":"Imagine _____ (win) the lottery.","options":["winning","to win","win","won"]}]},{"id":"gerund-transform","title":"Sätze umformen","blurb":"6 Aufgaben · Satz mit Gerund wählen","questions":[{"prompt":"Wähle die richtige Umformung: It is fun to ride a bike.","options":["Riding a bike is fun.","To riding a bike is fun.","Ride a bike is fun."]},{"prompt":"It is easy to forget names.","options":["Forgetting names is easy.","Forget names is easy.","To forgetting names is easy."]},{"prompt":"It is important to be on time.","options":["Being on time is important.","Be on time is important.","To being on time is important."]},{"prompt":"I look forward _____ my friends. (see)","options":["I look forward to seeing my friends.","I look forward to see my friends.","I look forward seeing my friends."]},{"prompt":"She is afraid of _____ her keys. (lose)","options":["She is afraid of losing her keys.","She is afraid of to lose her keys.","She is afraid of lose her keys."]},{"prompt":"He is good at _____ bikes. (fix)","options":["He is good at fixing bikes.","He is good at to fix bikes.","He is good at fix bikes."]}]}]},{"id":"be-ae","title":"British & American English","section":"Teil 1 · Von Montag","teaser":"Wortschatz und typische Rechtschreibunterschiede","lessonTitle":"BE oder AE?","tables":[{"columns":["British","American","Deutsch"],"rows":[["flat","apartment","Wohnung"],["holiday(s)","vacation","Urlaub / Ferien"],["football","soccer","Fußball"],["cinema","movie theater","Kino"],["shop","store","Geschäft / Laden"],["shopping centre","shopping mall","Einkaufszentrum"],["lift","elevator","Fahrstuhl"],["rubbish","garbage / trash","Müll"],["pavement","sidewalk","Bürgersteig"],["torch","flashlight","Taschenlampe"]]}],"lesson":[{"heading":"Wortschatz","body":"In Klassenarbeiten musst du oft das britische oder amerikanische Pendant einsetzen. Lerne die Paare zusammen, nicht einzeln.","examples":[]},{"heading":"Rechtschreibung","body":"Häufig abgefragt: BE -our/-re/-ise (colour, centre, organise, neighbourhood) gegen AE -or/-er/-ize (color, center, organize, neighborhood). Dieselbe Regel gilt auch für favourite/favorite.","examples":[]}],"quizzes":[{"id":"beae-words","title":"Wortschatz BE ↔ AE","blurb":"10 Aufgaben · das passende Wort wählen","questions":[{"prompt":"British English: flat → American English?","options":["apartment","lift","store","vacation"]},{"prompt":"American English: store → British English?","options":["shop","flat","cinema","pavement"]},{"prompt":"Was ist das amerikanische Wort für football?","options":["soccer","football","pavement","elevator"]},{"prompt":"Was ist das britische Wort für elevator?","options":["lift","flat","torch","rubbish"]},{"prompt":"British English: holiday → American English?","options":["vacation","cinema","sidewalk","garbage"]},{"prompt":"American English: movie theater → British English?","options":["cinema","shop","mall","torch"]},{"prompt":"Welches amerikanische Wort passt zu rubbish?","options":["garbage","pavement","lift","shop"]},{"prompt":"American English: sidewalk → British English?","options":["pavement","torch","flat","holiday"]},{"prompt":"Was ist das amerikanische Wort für torch?","options":["flashlight","elevator","soccer","apartment"]},{"prompt":"British English: shopping centre → American English?","options":["shopping mall","cinema","pavement","storey"]}]},{"id":"beae-spelling","title":"Rechtschreibung BE / AE","blurb":"8 Aufgaben · -our/-or, -re/-er, -ise/-ize","questions":[{"prompt":"Wie schreibt man colour auf American English?","options":["color","colour","coler","collor"]},{"prompt":"Wie schreibt man center auf British English?","options":["centre","center","centere","centré"]},{"prompt":"Welche Schreibweise von organise ist amerikanisch?","options":["organize","organise","organice","organeese"]},{"prompt":"Wie schreibt man neighbourhood auf American English?","options":["neighborhood","neighbourhood","nieghborhood","neighborhoud"]},{"prompt":"Wie schreibt man favourite auf American English?","options":["favorite","favourite","favorit","favourit"]},{"prompt":"Welche Schreibweise ist britisch?","options":["neighbourhood","neighborhood","neighborhod","neighbourhod"]},{"prompt":"In American English schreibt man:","options":["center","centre","centrum","centar"]},{"prompt":"Welche Schreibweise ist britisch?","options":["organise","organize","organiz","organisze"]}]}]},{"id":"tenses","title":"Simple Present & Progressive","section":"Teil 1 · Von Montag","teaser":"Gewohnheit oder genau jetzt? Signalwörter und Zustandsverben","lessonTitle":"Welche Zeitform?","tables":[],"lesson":[{"heading":"Simple Present","body":"Für Dinge, die immer, regelmäßig oder oft passieren: Hobbys, Routinen, Fakten. Signalwörter: always, usually, often, sometimes, never, every day. Form: Grundform, bei he/she/it kommt -s dazu.","examples":["Matt usually lives in Pittsburgh."]},{"heading":"Present Progressive","body":"Für Handlungen, die genau jetzt oder nur vorübergehend passieren. Signalwörter: now, at the moment, look!, listen!. Form: am/is/are + Verb-ing.","examples":["Right now, I am reading a grammar book."]},{"heading":"Zustandsverben","body":"Verben wie like, love, hate, want, know und understand stehen fast nie im Progressive, sondern im Simple Present. Richtig: I like pizza. Falsch: I am liking pizza.","examples":[]}],"quizzes":[{"id":"tense-form","title":"Die richtige Zeitform","blurb":"8 Aufgaben · Simple Present oder Progressive","questions":[{"prompt":"Look! The dog _____ (chase) the cat.","options":["is chasing","chases","chase","chasing"]},{"prompt":"My mum usually _____ (drink) tea in the morning.","options":["drinks","is drinking","drink","drinking"]},{"prompt":"Quiet! The students _____ (take) a test at the moment.","options":["are taking","take","takes","taking"]},{"prompt":"We sometimes _____ (go) to the swimming pool on Fridays.","options":["go","are going","goes","going"]},{"prompt":"Right now, Ben _____ (make) a sandwich.","options":["is making","makes","make","is makeing"]},{"prompt":"She _____ (know) a lot about dinosaurs.","options":["knows","is knowing","know","knowing"]},{"prompt":"Listen! Someone _____ (knock) at the door.","options":["is knocking","knocks","knock","knocking"]},{"prompt":"I _____ (want) a glass of water.","options":["want","am wanting","wants","wanting"]}]},{"id":"tense-neg-q","title":"Verneinungen und Fragen","blurb":"8 Aufgaben · don't/doesn't, am/is/are not, Do/Does/Is","questions":[{"prompt":"Bilde die Verneinung: She plays tennis every Monday.","options":["She doesn't play tennis every Monday.","She doesn't plays tennis every Monday.","She isn't play tennis every Monday."]},{"prompt":"Bilde die Frage: They are watching the match.","options":["Are they watching the match?","Do they watching the match?","Are they watch the match?"]},{"prompt":"Bilde die Verneinung: He is wearing a blue jacket.","options":["He isn't wearing a blue jacket.","He doesn't wearing a blue jacket.","He isn't wear a blue jacket."]},{"prompt":"Bilde die Frage: You go to school by bike.","options":["Do you go to school by bike?","Are you go to school by bike?","Does you go to school by bike?"]},{"prompt":"Bilde die Verneinung: We always have breakfast at 7.","options":["We don't always have breakfast at 7.","We aren't always have breakfast at 7.","We don't always has breakfast at 7."]},{"prompt":"Bilde die Frage: Lisa is talking to her teacher.","options":["Is Lisa talking to her teacher?","Does Lisa talking to her teacher?","Is Lisa talk to her teacher?"]},{"prompt":"Bilde die Frage: He gets up at 6 every day.","options":["Does he get up at 6 every day?","Does he gets up at 6 every day?","Is he get up at 6 every day?"]},{"prompt":"Bilde die Verneinung: The children are running in the hall.","options":["The children aren't running in the hall.","The children don't running in the hall.","The children aren't run in the hall."]}]},{"id":"tense-cloze","title":"Lückentext","blurb":"6 Lücken in einem zusammenhängenden Text","questions":[{"prompt":"Lücke 1: I usually _____ early. (get up)","hint":"Signalwort usually","passage":"Hi, I'm Jake. I usually ___ early. Right now I ___ breakfast in the kitchen. My sister always ___ to music in the morning, but today she ___ our dad in the garden. Listen! The neighbour's dog ___ again. I ___ why it is so loud every day.","options":["get up","gets up","am getting am not understanding","doesn't understand","not understand"]}]}]},{"id":"mix","title":"Mix-Tests","section":"Teil 1 · Von Montag","teaser":"Alle Themen von Teil 1 zusammen, wie in einer Klassenarbeit.","lessonTitle":"Vor dem Test","tables":[],"lesson":[{"heading":"So läuft der Mix-Test","body":"Hier kommen Gerund, British/American English und die Zeitformen in einem Durchgang. Test A ist etwas kürzer, Test B länger und näher an einer Klassenarbeit: Lücken, Umformungen, Gerund oder Infinitiv, Rechtschreibung sowie Fragen und Verneinungen.","examples":[]},{"heading":"Tipp","body":"Lies zuerst die Signalwörter und die Wörter direkt vor der Lücke. Bei BE/AE schau genau, ob nach dem britischen oder dem amerikanischen Wort bzw. der Schreibweise gefragt ist.","examples":[]}],"quizzes":[{"id":"mix-a","title":"Übungstest A","blurb":"Teil 1 · 16 Aufgaben · Gerund, British/American English und Zeiten","questions":[{"prompt":"_____ (travel) around the world is her dream.","options":["Travelling","To travel","Travel","Traveelling"]},{"prompt":"My parents don't mind _____ (drive) me to school.","options":["driving","to drive","drive","driveing"]},{"prompt":"Sam enjoys _____ (take) photos of animals.","options":["taking","to take","take","takes"]},{"prompt":"She is good at _____ (speak) French.","options":["speaking","to speak","speak","spoken"]},{"prompt":"We are looking forward to _____ (have) a picnic.","options":["having","to have","have","had"]},{"prompt":"Thank you for _____ (carry) my bag.","options":["carrying","to carry","carry","carried"]},{"prompt":"Was ist das britische Wort für apartment?","options":["flat","lift","shop","pavement"]},{"prompt":"Was ist das amerikanische Wort für cinema?","options":["movie theater","shop","soccer","flashlight"]},{"prompt":"Welches amerikanische Wort passt zu rubbish?","options":["garbage","pavement","lift","holiday"]},{"prompt":"American English: sidewalk → British English?","options":["pavement","torch","store","vacation"]},{"prompt":"Wie schreibt man colour auf American English?","options":["color","colour","coler","collar"]},{"prompt":"Look! James _____ (climb) the tree.","options":["is climbing","climbs","climb","climbing"]},{"prompt":"We often _____ (eat) pasta on Fridays.","options":["eat","are eating","eats","eating"]},{"prompt":"She _____ (hate) getting up late.","options":["hates","is hating","hate","hating"]},{"prompt":"At the moment the kids _____ (play) outside.","options":["are playing","play","plays","playing"]},{"prompt":"Listen! The phone _____ (ring).","options":["is ringing","rings","ring","ringing"]}]},{"id":"mix-b","title":"Übungstest B","blurb":"Teil 1 · 20 Aufgaben · etwas anspruchsvoller, dieselben Themen","questions":[{"prompt":"_____ (sit) in the sun too long can be dangerous.","options":["Sitting","To sit","Sit","Siting"]},{"prompt":"He finished _____ (repair) his bike.","options":["repairing","to repair","repair","repaired"]},{"prompt":"I'm interested in _____ (become) a doctor.","options":["becoming","to become","become","became"]},{"prompt":"They left without _____ (close) the window.","options":["closing","to close","close","closed"]},{"prompt":"I want _____ (improve) my English.","options":["to improve","improving","improve","improved"]},{"prompt":"Please stop _____ (make) so much noise.","options":["making","to make","make","made"]},{"prompt":"She decided _____ (join) the choir.","options":["to join","joining","join","joins"]},{"prompt":"Imagine _____ (meet) a film star.","options":["meeting","to meet","meet","met"]},{"prompt":"British English: holiday → American English?","options":["vacation","cinema","apartment","garbage"]},{"prompt":"American English: elevator → British English?","options":["lift","flat","pavement","torch"]},{"prompt":"British English: torch → American English?","options":["flashlight","sidewalk","soccer","store"]},{"prompt":"Wie schreibt man neighbourhood auf American English?","options":["neighborhood","neighbourhood","nieghborhood","neighbor m taking part in a workshop on Saturday.","Look! They are planting trees.","Kelly Holmes is opening the new sports centre."]},{"heading":"Typische Signale","body":"Simple Present: usually, always, every day, at 8 a.m., on Monday (als Fahrplan). Present Progressive: now, look!, listen!, at the moment, this week, tomorrow (als Absprache).","examples":["Their plane arrives at 10.30. (Fahrplan)","My father is taking me to the match. (Arrangement)"]},{"heading":"Tipp für die Klassenarbeit","body":"Frage: Ist es ein Programm/eine Uhrzeit/eine Regel? → Simple Present. Ist es eine persönliche Absprache oder etwas, das gerade passiert? → Present Progressive. Verben wie understand, know, like, want stehen fast immer im Simple Present.","examples":["I don't understand this sentence.","Are you coming tomorrow?"]}],"quizzes":[{"id":"env-project","title":"The environment project","blurb":"Dialog aus der Klassenarbeit: Simple Present oder Present Progressive, 13 Lücken. Kurze Formen, wo möglich.","questions":[{"prompt":"Lücke 1: how _____ (get) information …","hint":"Kurzform ist hier bei are nicht möglich.","passage":"Tony: Hi Jim, how ___ (get) information for your environment project?\nJim: I ___ (take part) in a workshop at Faraway Travel. It's called “Eco-friendly travel and me”. It ___ (take place) on Saturday.\nTony: That sounds good! But I hope it ___ (not begin) too early …\nJim: Well, the workshop ___ (start) at 8 a.m. and ___ (go) until 4 p.m.\nTony: Wow, that's early and it's a full day. What ___ (do) so long?\nJim: From 8 a.m. to 12:30 p.m. the travel agents ___ (talk) to us about different eco travel topics, then from 1:30 p.m. to 3:30 p.m. we ___ (work) in small groups and ___ (plan) eco-friendly school trips. The group with the best idea ___ (win) a trip to Wild Nature Park! So will you come or not?\nTony: Are you joking? With a prize like that, of course I ___ (go) with you!\nJim: Good! I ___ (interview) one of the travel agents too and you can help me."},{"prompt t was allowed."}]}]},{"id":"gerund-ka","title":"Gerunds","section":"Teil 2 · Von den Arbeitsblättern","teaser":"Aus dem Arbeitsblatt: Dean’s E-Mail, Sätze umformen und weitere Übungen.","lessonTitle":"Wann steht das Gerund?","tables":[{"columns":["Wendung","Beispiel"],"rows":[["feel like","I feel like writing an email."],["worried about","I was worried about moving."],["tired of","I was tired of driving every day."],["crazy about","I've become crazy about skiing."],["dream of","He dreams of winning the race."],["get used to","I can't get used to having more time."],["thinking of","Are you thinking of coming in March?"],["good at","She's good at skiing."],["look forward to","I look forward to seeing you."]]}],"lesson":[{"heading":"Was ist ein Gerund?","body":"Ein Gerund ist ein Verb mit -ing, das wie ein Nomen benutzt wird. Nach vielen Verben (enjoy, mind, keep, stop, finish, hate, start), nach Präpositionen und nach Wendungen wie good at oder tired of steht das Gerund – nicht to + Infinitiv.","examples":["I enjoy riding my bike.","I'm tired of waiting.","She's good at skiing."]},{"heading":"Vorsicht bei to","body":"In look forward to, get used to und ähnlich ist to eine Präposition. Danach kommt ebenfalls das Gerund: look forward to seeing you, get used to having more time.","examples":["I'm looking forward to seeing you.","I can't get used to getting up so early."]},{"heading":"Rechtschreibung","body":"Wie beim Present Progressive: ein stummes -e am Ende fällt weg (write → writing, ride → riding). Nach kurzem betontem Vokal wird der Konsonant oft verdoppelt (get → getting, swim → swimming).","examples":["writing, riding, coming","getting, swimming, sitting"]},{"heading":"Kasten wie im Arbeitsblatt","body":"Typische Verbindungen aus dem Übungsblatt: feel like, worried about, tired of, crazy about, dream of, get used to, thinking of, good at, look forward to – danach immer Verb-ing.","examples":["worried about moving","dream of winning","look forward to having fun"]}   function view() {
    if (screen.name === "topic") {
      const topic = findTopic(screen.topicId);
      return topic ? topicView(topic) : homeView();
    }
    if (screen.name === "quiz") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? quizView(quiz) : homeView();
    }
    if (screen.name === "result") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? resultView(quiz, screen) : homeView();
    }
    if (screen.name === "solutions") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? solutionsView(screen.topicId, screen.quizId) : homeView();
    }
    if (screen.name === "eltern") return elternView();
    return homeView();
  }

  function render() {
    document.getElementById("app").innerHTML = view();
    const input = document.getElementById("gap-input");
    if (input && quizState && !quizState.checked) {
      input.addEventListener("input", function () { quizState.typed = input.value; });
    }
    const pw = document.getElementById("pw-input");
    if (pw && !pwBusy) pw.focus();
  }

  async function checkAnswer(value) {
    if (!quizState || quizState.checked || !String(value).trim()) return;
    const quiz = findQuiz(screen.topicId, screen.quizId);
    const question = quiz.questions[quizState.index];
    const right = await isRight(screen.topicId, screen.quizId, quizState.index, value);
    const attemptNo = recordAttempt(screen.topicId, screen.quizId, quizState.index, value, right);
    const retry = attemptNo > 1;
    quizState.chosen = value;
    quizState.checked = true;
    quizState.ok = right;
    quizState.retry = retry;
    quizState.attemptNo = attemptNo;
    if (right) {
      quizState.runScore += 1;
      if (!retry) quizState.score += 1;
    } else {
      quizState.mistakes.push({ prompt: question.prompt, given: value, index: quizState.index });
    }
    render();
  }

  async function submitPassword(password, next) {
    if (pwBusy) return;
    pwBusy = true;
    pwError = "";
    render();
    try {
      if (next === "reset-log") {
        const key = await deriveKey(password, vault.salt);
        await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64dec(vault.iv) },
          key,
          b64dec(vault.ciphertext)
        );
        clearLog();
        resetConfirm = false;
        pwError = "";
        screen = { name: "eltern" };
        await queueIntegrity({ bump: true, parentReset: true, rerender: true });
      } else {
        await unlockWithPassword(password);
        screen.showPw = false;
        if (next === "eltern") screen = { name: "eltern" };
        else if (next === "solutions" || screen.name === "solutions") {
          screen = { name: "solutions", topicId: screen.topicId, quizId: screen.quizId };
        }
      }
    } catch (e) {
      pwError = "Das Passwort ist falsch.";
      if (next !== "reset-log") {
        unlocked = false;
        solutions = null;
      }
    }
    pwBusy = false;
    render();
  }

  function onClick(event) {
    const el = event.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "password-form" || act === "check-form") return;
    const a = decodeURIComponent(el.getAttribute("data-arg") || "");
    if (act === "open-topic") {
      screen = { name: "topic", topicId: a };
      render();
    } else if (act === "home") {
      screen = { name: "home" };
      render();
    } else if (act === "start-quiz") {
      startQuiz(decodeURIComponent(el.getAttribute("data-topic") || ""), a);
    } else if (act === "back-topic") {
      screen = { name: "topic", topicId: screen.topicId };
      quizState = null;
      pwError = "";
      render();
    } else if (act === "pick") {
      checkAnswer(a);
    } else if (act === "next") {
      quizState.index += 1;
      quizState.typed = "";
      quizState.chosen = null;
      quizState.checked = false;
      quizState.ok = false;
      quizState.retry = false;
      quizState.attemptNo = 0;
      render();
    } else if (act === "finish") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      const official = officialFirstScore(screen.topicId, screen.quizId, quiz.questions.length);
      recordScore(screen.topicId, screen.quizId, official, quiz.questions.length);
      screen = {
        name: "result",
        topicId: screen.topicId,
        quizId: screen.quizId,
        score: official,
        runScore: quizState.runScore,
        total: quiz.questions.length,
        mistakes: quizState.mistakes,
        showPw: false
      };
      quizState = null;
      render();
    } else if (act === "retry") {
      startQuiz(screen.topicId, screen.quizId);
    } else if (act === "open-solutions") {
      const topicId = decodeURIComponent(el.getAttribute("data-topic") || screen.topicId);
      screen = { name: "solutions", topicId: topicId, quizId: a };
      pwError = "";
      render();
    } else if (act === "ask-password") {
      screen.showPw = true;
      pwError = "";
      render();
    } else if (act === "open-eltern") {
      screen = { name: "eltern" };
      pwError = "";
      resetConfirm = false;
      render();
    } else if (act === "ask-reset-log") {
      resetConfirm = true;
      pwError = "";
      render();
    }
  }

  function onSubmit(event) {
    const form = event.target.closest("form");
    if (!form) return;
    event.preventDefault();
    const act = form.getAttribute("data-act");
    if (act === "check-form") {
      const input = document.getElementById("gap-input");
      checkAnswer(input ? input.value : "");
    } else if (act === "password-form") {
      const input = document.getElementById("pw-input");
      submitPassword(input ? input.value : "", form.getAttribute("data-next") || "solutions");
    }
  }

  const app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("submit", onSubmit);
  render();
  queueIntegrity({ bump: true, rerender: true });
})();

  </script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js");
    });
  }
  </script>
